<html>
<head>
<title>Neueintrag ins Gästebuch</title>
</head>
<body BGCOLOR="#000000" background="http://www.alvier.ch/gaestebuch99/gbookbgnd.jpg" text="#FFFF00" link="#FF00FF">
<p>&nbsp;</p>
<p align="center"><big><big><big><big><strong>Gästebucheintrag</strong></big></big></big></big></p>
<p align="center">&nbsp;</p>
<p align="center"><font face="Arial, helvetica"><strong>Bitte füllen Sie dieses Formular
aus!<br>
</strong></font></p>
<form method="POST" action="$ACTION$" align="center">
<input type="hidden" name="required" value=",name">
<input type="hidden" name="order" value="timedate,name,vulgo,ort,mailfrom,homepage,kommentar">
<div align="center"><center><table
  border="1" cellspacing="0" width="80%" bgcolor="#2C487E" cellpadding="3">
    <tr>
      <td width="100%" colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td width="30%"><font face="Arial, helvetica" color="#FFFF00"><strong>Name Vorname * </strong></font></td>
      <td width="70%"><font color="#FFFF00"><input type="text" name="name" size="40" ></font></td>
    </tr>
    <tr>
      <td width="30%"><font face="Arial, helvetica" color="#FFFF00"><strong>Pfadiname</strong></font></td>
      <td width="70%"><font color="#FFFF00"><input type="text" name="vulgo" size="40" ></font></td>
    </tr>
    <tr>
      <td width="30%"><font face="Arial, helvetica" color="#FFFF00"><strong>Pfadiabteilung</strong></font></td>
      <td width="70%"><font color="#FFFF00"><input type="text" name="ort" size="40" ></font></td>
    </tr>
    <tr>
      <td width="30%"><font face="Arial, helvetica" color="#FFFF00"><strong>e-mail</strong></font></td>
      <td width="70%"><font color="#FFFF00"><input type="text" name="mailfrom" size="40" ></font></td>
    </tr>
    <tr>
      <td width="30%"><font face="Arial, helvetica" color="#FFFF00"><strong>Homepage</strong></font></td>
      <td width="70%"><font color="#FFFF00"><input type="text" name="homepage" size="40"  value="http://" ></font></td>
    </tr>
    <tr>
      <td width="30%"><font face="Arial, helvetica" color="#FFFF00"><strong>Kommentar</strong></font></td>
      <td width="70%"><font color="#FFFF00"><textarea rows="8" name="kommentar" cols="40"></textarea></font></td>
    </tr>
    <tr>
      <td width="30%">&nbsp;<p>&nbsp;</td>
      <td width="70%"><font color="#FFFF00"><input type="submit" value="Abschicken" name="B1"><input
      type="reset" value="Zurücksetzen" name="B2"></font></td>
    </tr>
  </table>
  </center></div>
</form>
</body>
</html>
