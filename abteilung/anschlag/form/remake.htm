function check(){
  with(document.Formular) {
    if (datum.value=="") { alert('Fehler in Datum'); return 0; }

function init(){
  with(document.Formular) {
    remake.value="$idnum$";
    datum.value="$datum$";
    titel.value="$titel$";
    anzeit.value="$anzeit$";
    anort.value="$anort$";
    abzeit.value="$abzeit$";
    abort.value="$abort$";
    tenu.value="$tenu$";
    mit.value="$mit$";
    bes.value="$bes$";
    sign.value="$sign$";
    switch("$stufe$"){
      case "abteilung":
        stufe.options[1].selected=1;
        break;
      case "stufe1":
        stufe.options[2].selected=1;
        break;
      case "bienli":
        stufe.options[3].selected=1;
        break;
      case "woelf":
        stufe.options[4].selected=1;
        break;
      case "stufe2":
        stufe.options[5].selected=1;
        break;
      case "pfader":
        stufe.options[6].selected=1;
        break;
      case "pfaderinnen":
        stufe.options[7].selected=1;
        break;
      case "raider":
        stufe.options[8].selected=1;
        break;
      case "rover":
        stufe.options[9].selected=1;
        break;
      case "biber":
        stufe.options[10].selected=1;
        break;
      }
    }
  }
//-->
</SCRIPT>
