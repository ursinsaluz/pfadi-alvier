<SCRIPT language="JavaScript">
<!--
function check(){
  with(document.Formular) {
    if ((day.value=="")||(month.value=="")||(year.value=="")) { alert('Fehler in Datum'); return 0; }
    if (stufe.options[0].selected == true) { alert('Fehler in Stufe'); return 0; }
    if (anzeit.value=="") { alert('Fehler in Antreten/Zeit'); return 0; }
    if (anort.value=="") { alert('Fehler in Antreten/Ort'); return 0; }
    if (abzeit.value=="") { alert('Fehler in Abtreten/Zeit'); return 0; }
    if (abort.value=="") { alert('Fehler in Abtreten/Ort'); return 0; }
    if (sign.value=="") { alert('Fehler in Signatur (Miis Bescht ...)'); return 0; }
    datum.value=day.value + "." + month.value + "." + year.value;
    }
  document.Formular.submit();
  }


function init(){
  var Jetzt = new Date();
  var Tag = Jetzt.getDay();
  if (Tag > 6) { Tag = 6 ; }
  else (Tag = 6 - Tag)
  var AbsolutJetzt = Jetzt.getTime();
  var AbsolutDann = AbsolutJetzt + (Tag*24*60*60*1000);
  Jetzt.setTime(AbsolutDann);
  var Tag = Jetzt.getDate();
  var Monat = Jetzt.getMonth() + 1;
  Monat = ((Monat < 10) ? "0" : "") + Monat;
  var Jahr = Jetzt.getYear();
  if(navigator.appName == "Netscape") {
    Jahr = Jahr + 1900;
    }

  if (! document.Formular.day.value) {
    document.Formular.day.value=Tag;
    }
  if (! document.Formular.month.value) {
    document.Formular.month.value=Monat;
    }
  if (! document.Formular.year.value) {
    document.Formular.year.value=Jahr;
    }
  if (! document.Formular.sign.value) {
    document.Formular.sign.value="Die Leiter";
    }
  }
//-->
</SCRIPT>
